<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraveCart</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1><img src="CraveCart.png" alt="CraveCart Logo" class="logo"></h1>
    <nav>
      <ul>
        <li><a href="#look-up">Search</a></li>
        <li><a href="#log-in">Account</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="top-section">
      <section id="look-up">
        <h2>Craving something?</h2>
        
        <form class="controls" role="search">
          <div class="field">
            <label for="search">Search by name</label>
            <input id="search" type="search" placeholder="e.g., bananas">
          </div>
          
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="All">All</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Dairy">Dairy</option>
              <option value="Bakery">Bakery</option>
              <option value="Meat & Seafood">Meat & Seafood</option>
              <option value="Beverages">Beverages</option>
              <option value="Snacks">Snacks</option>
            </select>
          </div>
        </form>
      </section>

      <section class="login" id="log-in">
        <h2>Sign in</h2>

        <form class="login-form">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="example@example.com" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>

          <button type="submit">Log in</button>
        </form>

        <p id="welcome" role="status"></p>
      </section>
    </div>

    <section id="products">
      <h2>Products</h2>
      <p id="count" role="status"></p>
      <ul id="list" class="cards"></ul>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>CraveCart is a mock grocery store site.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>CSC 3050</p>
  </footer>
</body>
</html>
